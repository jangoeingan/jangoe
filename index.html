:root{--navy:#071a2b;--gold:#d5aa63;--gold2:#b88943}

html,body{margin:0;min-height:100%;background:var(--navy);color:var(--gold)}
body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",sans-serif}

.n{display:inline-grid;place-items:center;width:23px;height:23px;border:1px solid currentColor;border-radius:4px;font-family:Georgia,serif;font-weight:700;font-size:13px}
footer{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:rgba(213,170,99,.42);font-size:10px;letter-spacing:.18em}
