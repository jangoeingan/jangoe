<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>場外人間 | 트레이딩 시스템</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@900&display=swap" rel="stylesheet">  
<style>
:root {
  --navy: #0B2239;
  --gold: #d5aa63;
  --gold2: #e1bb78;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: var(--navy);
}

body {
  min-height: 100svh;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--gold);
  font-family: Arial, "Noto Sans CJK KR", "Malgun Gothic", sans-serif;
}

.card {
  width: min(92vw, 520px);
  text-align: center;
  padding: 48px 24px;
}

.brand {
  margin: 0;
  font-family: "Noto Sans KR", sans-serif;
  font-size: clamp(60px, 15vw, 96px);
  font-weight: 900;
  line-height: 1.08;
  letter-spacing: .015em;
  color: #e2b665;
}

.rule {
  width: 72%;
  height: 1px;
  margin: 24px auto 17px;
  background: linear-gradient(
    90deg,
    transparent,
    var(--gold),
    transparent
  );
  opacity: .55;
}

.subtitle {
  font-size: 15px;
  font-weight: 500;
  letter-spacing: .48em;
  margin-left: .48em;
}

.blog {
  margin: 58px auto 0;
  width: 390px;
  max-width: 100%;
  height: 58px;
  border: 1px solid rgba(213,170,99,.8);
  border-radius: 7px;
  background: transparent;
  color: var(--gold2);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  text-decoration: none;
  font-size: 15px;
  letter-spacing: .08em;
}

.blog:hover {
  background: rgba(213,170,99,.06);
}

.n {
  width: 21px;
  height: 21px;
  border: 1px solid var(--gold);
  border-radius: 3px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 12px;
}

.arrow {
  font-size: 18px;
}

.footer {
  margin-top: 28px;
  font-size: 10px;
  letter-spacing: .22em;
  opacity: .5;
}
</style>
</head>

<body>

<main class="card">

  <h1 class="brand">場外人間</h1>

  <div class="rule"></div>

  <div class="subtitle">시스템 매매</div>

  <a class="blog"
     href="https://blog.naver.com/trend-follower"
     target="_blank"
     rel="noopener">

    <span class="n">N</span>
    <span>블로그 바로가기</span>
    <span class="arrow">→</span>

  </a>

  <div class="footer">JANGOE.KR</div>

</main>

</body>
</html>
